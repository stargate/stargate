name: Check Dependencies

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 0 * * MON'
  workflow_dispatch:

jobs:
  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 8.0.332
          cache: 'maven'
      
      - name: Setup Maven
        env:
          TAAS_ARTIFACTORY_USERNAME: ${{ secrets.TAAS_ARTIFACTORY_USERNAME }}
          TAAS_ARTIFACTORY_PASSWORD: ${{ secrets.TAAS_ARTIFACTORY_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          # Route only the private DSE repo IDs (declared in coordinator/persistence-dse-*/pom.xml) through the IBM TaaS Artifactory.
          # Central and other public repos are not mirrored, so open source builds keep working without credentials.
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>taas-mirror</id>
                <username>${TAAS_ARTIFACTORY_USERNAME}</username>
                <password>${TAAS_ARTIFACTORY_PASSWORD}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>taas-mirror</id>
                <name>TaaS DataStax Virtual (private DSE repos only)</name>
                <url>https://na.artifactory.swg-devops.com/artifactory/datastax-team-nosql-dse-maven-virtual</url>
                <mirrorOf>artifactory-snapshots,artifactory-releases,artifactory-dse,artifactory-public</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Check Maven Dependency Updates
        run: |
          cd coordinator/
          mvn -B -ntp versions:display-dependency-updates -Dversions.outputFile=target/dependency-updates-report.txt

      - name: Archive dependency update results
        uses: actions/upload-artifact@v7
        with:
          name: dependency-update-report
          path: coordinator/target/dependency-updates-report.txt

  check-vulnerabilities:
    name: Check Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 8.0.332
          cache: 'maven'

      - name: Setup Maven
        env:
          TAAS_ARTIFACTORY_USERNAME: ${{ secrets.TAAS_ARTIFACTORY_USERNAME }}
          TAAS_ARTIFACTORY_PASSWORD: ${{ secrets.TAAS_ARTIFACTORY_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          # Route only the private DSE repo IDs (declared in coordinator/persistence-dse-*/pom.xml) through the IBM TaaS Artifactory.
          # Central and other public repos are not mirrored, so open source builds keep working without credentials.
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>taas-mirror</id>
                <username>${TAAS_ARTIFACTORY_USERNAME}</username>
                <password>${TAAS_ARTIFACTORY_PASSWORD}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>taas-mirror</id>
                <name>TaaS DataStax Virtual (private DSE repos only)</name>
                <url>https://na.artifactory.swg-devops.com/artifactory/datastax-team-nosql-dse-maven-virtual</url>
                <mirrorOf>artifactory-snapshots,artifactory-releases,artifactory-dse,artifactory-public</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Check Maven Dependencies
        run: |
          cd coordinator/
          mvn -B -ntp dependency-check:aggregate

      - name: Archive vulnerability results
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: coordinator/target/dependency-check-report.html